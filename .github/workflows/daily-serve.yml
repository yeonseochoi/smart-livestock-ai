# 매일 위험도 예보를 계산해 PostgreSQL(Supabase)에 적재한다.
#
# 왜 필요한가
#   러너 컨테이너는 잡이 끝나면 사라진다. DB 가 저장소 안(out/demo.db)에 있으면
#   매일 계산해도 결과가 남지 않는다. 그래서 DB 를 Supabase 로 옮겼고,
#   이 워크플로는 DATABASE_URL 하나만 보고 바깥 DB 에 쓴다.
#
# 준비물 (Settings -> Secrets and variables -> Actions)
#   DATABASE_URL : Supabase 접속 문자열.
#                  반드시 Session/Transaction pooler 문자열을 쓸 것.
#                  Direct connection(db.xxx.supabase.co:5432)은 무료 티어에서
#                  IPv6 전용이라 러너(IPv4)에서 붙지 않는다.
#
# ★ KMA_KEY 는 절대 Secret 으로 넣지 말 것.
#   serving/kma_midterm.py 의 _service_key() 가 환경변수 경로에만 unquote() 를
#   빼먹어서, 설정하면 이중 인코딩으로 중기예보(D+4~7)가 조용히 깨진다.
#   설정하지 않으면 파일 안의 폴백 키를 쓰며 정상 동작한다.

name: 매일 위험도 적재

on:
  schedule:
    # 22:00 UTC = 익일 07:00 KST. serving/scheduler.py 의 RUN_HOUR=7 과 맞춘 값이다.
    # (18시 발표본에는 D+4 필드가 없어 6시로 당기면 하루치가 NaN 이 된다)
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      retrain:
        description: "학습 산출물 캐시를 무시하고 다시 학습"
        type: boolean
        default: false

concurrency:
  group: daily-serve
  cancel-in-progress: false

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: demo
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONIOENCODING: utf-8
      # 원본 데이터(프로젝트 데이터/)를 교체하면 이 숫자를 올려 캐시를 버린다.
      # 한글 경로라 hashFiles 로 키를 잡지 않고 수동 버전을 쓴다.
      DATA_VERSION: "2026-08-18"

    steps:
      - uses: actions/checkout@v4

      - name: DATABASE_URL secret 확인
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret 이 없습니다. 이게 없으면 러너 안의"
            echo "::error::SQLite 로 폴백해 결과가 잡 종료와 함께 사라집니다."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: demo/requirements.txt

      - run: pip install -r requirements.txt

      - name: 학습 산출물 캐시
        id: artifacts
        uses: actions/cache@v4
        with:
          path: demo/data
          key: slai-artifacts-${{ env.DATA_VERSION }}-${{ hashFiles('demo/**/*.py') }}

      - name: 학습 (산출물이 없을 때만, 약 3~10분)
        run: |
          if [ "${{ inputs.retrain }}" = "true" ] || ! ls data/model_*_reduced.pkl >/dev/null 2>&1; then
            python run_train.py
          else
            echo "캐시된 학습 산출물 사용 — 학습 생략"
          fi

      - name: 서빙 — 예보 조회 후 DB 적재
        run: python run_serve.py

      - name: 적재 검증 (39항목)
        run: python run_check.py
